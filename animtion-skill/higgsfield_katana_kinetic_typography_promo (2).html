    /***************************************************************************
     * 3. MATH & EASING HELPERS
     ***************************************************************************/
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const norm = (t, s, e) => clamp((t - s) / (e - s), 0, 1);
    const easeOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
    const easeInExpo = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
    const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
    const easeInCubic = (x) => x * x * x;
    const easeInOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const easeOutBack = (x) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    };

    /***************************************************************************
     * 4. FLOATING BOKEH EMBERS RENDERER
     ***************************************************************************/
    const EMBERS = Array.from({ length: 48 }, (_, i) => ({
      x: (i * 173) % 100,
      y: (i * 293) % 100,
      r: 5 + (i % 7) * 5,
      vx: -1.8 + (i % 5) * 0.9,
      vy: -3.2 - (i % 6) * 1.1,
      a: 0.35 + (i % 5) * 0.12
    }));

    function drawEmbers(t, show) {
      emberCanvas.style.opacity = show ? '1' : '0';
      if (!show) return;
      const w = emberCanvas.width;
      const h = emberCanvas.height;
      emberCtx.clearRect(0, 0, w, h);

      for (let i = 0; i < EMBERS.length; i++) {
        const p = EMBERS[i];
        const px = (((p.x + p.vx * t) % 100 + 100) % 100) * 0.01 * w;
        const py = (((p.y + p.vy * t) % 100 + 100) % 100) * 0.01 * h;
        const rad = p.r * (Math.min(w, h) / 700);

        const g = emberCtx.createRadialGradient(px, py, 0, px, py, rad * 2.5);
        g.addColorStop(0, `rgba(255, 210, 120, ${p.a})`);
        g.addColorStop(0.45, `rgba(255, 85, 0, ${p.a * 0.75})`);
        g.addColorStop(1, 'rgba(255, 40, 0, 0)');
        emberCtx.fillStyle = g;
        emberCtx.beginPath();
        emberCtx.arc(px, py, rad * 2.5, 0, Math.PI * 2);
        emberCtx.fill();
      }
    }

    /***************************************************************************
     * 5. WEB AUDIO API PROCEDURAL SFX & BEAT SYNTHESIZER
     ***************************************************************************/
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.lastStep = -1;
        this.lastShotId = -1;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      boom(freq = 62, dur = 0.38) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq * 2, now);
        o.frequency.exponentialRampToValueAtTime(28, now + dur);
        g.gain.setValueAtTime(0.32, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        o.connect(g);
        g.connect(this.ctx.destination);
        o.start(now);
        o.stop(now + dur);
      }
      slash() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const len = Math.floor(this.ctx.sampleRate * 0.28);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.06));
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const flt = this.ctx.createBiquadFilter();
        flt.type = 'bandpass';
        flt.frequency.setValueAtTime(3400, now);
        flt.frequency.exponentialRampToValueAtTime(750, now + 0.26);
        flt.Q.value = 2.8;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.38, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.27);
        src.connect(flt);
        flt.connect(g);
        g.connect(this.ctx.destination);
        src.start(now);
      }
      tick(hi = false) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(hi ? 1600 : 950, now);
        o.frequency.exponentialRampToValueAtTime(250, now + 0.03);
        g.gain.setValueAtTime(0.08, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        o.connect(g);
        g.connect(this.ctx.destination);
        o.start(now);
        o.stop(now + 0.035);
      }
      update(t, shotId, playing) {
        if (!playing || !this.enabled || !this.ctx) return;
        const step = Math.floor(t * 4);
        if (step !== this.lastStep) {
          this.lastStep = step;
          this.tick(step % 2 === 0);
        }
        if (shotId !== this.lastShotId) {
          this.lastShotId = shotId;
          if ([2, 5, 12, 15, 16, 18, 20, 29, 32, 40, 44].includes(shotId)) {
            this.slash();
          } else {
            this.boom(60, 0.3);
          }
        }
      }
    }

      isPlaying = !isPlaying;
      lastNow = performance.now();
      syncHUD();
    }

      audio.init();
      isPlaying = false;
      const cur = getActiveShot(currentTime);
      let nextIdx = SHOTS.findIndex(s => s.id === cur.id) + dir;
      if (nextIdx < 0) nextIdx = SHOTS.length - 1;
      if (nextIdx >= SHOTS.length) nextIdx = 0;
      currentTime = SHOTS[nextIdx].s + 0.02;
      syncHUD();
      renderFrame(currentTime);
    }

      currentTime = parseFloat(e.target.value);
      syncHUD();
      renderFrame(currentTime);
    });

    document.getElementById('btn-speed').addEventListener('click', (e) => {
      playbackSpeed = playbackSpeed === 1.0 ? 0.5 : playbackSpeed === 0.5 ? 0.25 : 1.0;
      e.currentTarget.textContent = `${playbackSpeed}x`;
    });

    document.getElementById('btn-fit').addEventListener('click', (e) => {
      stretchMode = !stretchMode;
      e.currentTarget.textContent = stretchMode ? 'Fit: Stretch' : 'Fit: Contain';
      updateViewportScale();
    });

    document.getElementById('btn-sfx').addEventListener('click', (e) => {
      audio.init();
      audio.enabled = !audio.enabled;
      e.currentTarget.textContent = audio.enabled ? '🔊 SFX' : '🔇 Muted';
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        stepShot(1);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        stepShot(-1);
      }
    });

    function loop(now) {
      const dt = ((now - lastNow) / 1000) * playbackSpeed;
      lastNow = now;

      if (isPlaying) {
        currentTime += dt;
        if (currentTime >= TOTAL_DURATION) currentTime = 0;
        syncHUD();
        const activeShot = getActiveShot(currentTime);
        audio.update(currentTime, activeShot.id, isPlaying);
      }

      renderFrame(currentTime);
      requestAnimationFrame(loop);
    }

    window.onload = () => {
      updateViewportScale();
      syncHUD();
      renderFrame(0);
      lastNow = performance.now();
      requestAnimationFrame(loop);
    };
  </script>
</body>
</html>
