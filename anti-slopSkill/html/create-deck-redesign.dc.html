<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create deck</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',sans-serif}
.sl{--radius:.625rem;--background:#0b0c14;--foreground:#fff;--card:#151722;--primary:#9333ea;--primary-shadow:#6b21a8;--secondary:#1c1f2e;--secondary-shadow:#121420;--muted:#1a1c29;--muted-foreground:#8e92a8;--accent:#201833;--accent-foreground:#c084fc;--border:#222536;--border-shadow:#141622;--streak-gold:#f59e0b}
.sl button{font-family:inherit;cursor:pointer}
.sl input{font-family:inherit}
.sl input::placeholder{color:#8e92a8}
.sl input:focus{border-color:#9333ea}
.tactile-btn{transition:transform .08s ease,box-shadow .08s ease}
.tactile-btn:active{transform:translateY(3px)!important;box-shadow:0 1px 0 0 transparent!important}
</style>
</helmet>
<div class="sl" style="position:relative;width:390px;height:844px;overflow:hidden;background:#0b0c14;color:#fff">
  <div style="padding:64px 20px 0">
    <div style="font-size:28px;font-weight:900;letter-spacing:-.01em;text-transform:uppercase">My Library</div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <div style="padding:8px 16px;border-radius:999px;background:#9333ea;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase">All</div>
      <div style="padding:8px 16px;border-radius:999px;background:#1a1c29;font-size:12px;font-weight:800;letter-spacing:.06em;color:#8e92a8;text-transform:uppercase">Maze (0)</div>
      <div style="padding:8px 16px;border-radius:999px;background:#1a1c29;font-size:12px;font-weight:800;letter-spacing:.06em;color:#8e92a8;text-transform:uppercase">Laurence (0)</div>
    </div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(5,6,12,.74)"></div>

  <div style="position:absolute;left:0;right:0;bottom:0;background:#0b0c14;border-radius:26px 26px 0 0;border:2px solid #222536;border-bottom:0;display:flex;flex-direction:column;padding:0 20px 28px;box-sizing:border-box">
    <div style="width:40px;height:5px;border-radius:3px;background:#222536;margin:10px auto 0"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;height:64px">
      <h1 style="margin:0;font-size:24px;font-weight:900;letter-spacing:.01em;text-transform:uppercase">Create Deck</h1>
      <button class="tactile-btn" aria-label="Close" style="width:44px;height:44px;border-radius:14px;border:2px solid #222536;background:#1c1f2e;box-shadow:0 3px 0 0 #121420;display:grid;place-items:center;padding:0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="padding:4px;border-radius:26px;background:#1a1c29;border:2px solid #222536;display:flex;gap:4px">
      <button class="tactile-btn" style="flex:1;height:44px;border-radius:22px;border:0;background:transparent;color:#8e92a8;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">Paste text</button>
      <button class="tactile-btn" style="flex:1;height:44px;border-radius:22px;border:0;background:#9333ea;color:#fff;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 3px 0 0 #6b21a8;display:flex;align-items:center;justify-content:center;gap:8px">Upload files
        <span style="height:20px;padding:0 8px;border-radius:999px;background:#f59e0b;color:#000;font-size:10px;font-weight:900;letter-spacing:.06em;display:inline-flex;align-items:center">PRO</span>
      </button>
    </div>

    <div style="margin-top:24px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <label for="t" style="font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase">Deck title</label>
      </div>
      <input id="t" type="text" placeholder="Optional" style="width:100%;box-sizing:border-box;height:48px;padding:0 16px;border-radius:16px;border:2px solid #222536;background:#1a1c29;color:#fff;font-size:16px;outline:none">
    </div>

    <div style="margin-top:16px;border-radius:18px;border:2px dashed #2f3350;background:#151722;box-shadow:0 6px 0 0 #141622;padding:32px 20px;display:flex;flex-direction:column;align-items:center;text-align:center">
      <div style="width:48px;height:48px;border-radius:16px;background:rgba(147,51,234,.15);border:2px solid rgba(147,51,234,.3);display:grid;place-items:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
      </div>
      <div style="margin-top:16px;font-size:14px;line-height:1.4;font-weight:900;letter-spacing:.06em;text-transform:uppercase;max-width:240px">Sending files is a Pro feature</div>
    </div>

    <button class="tactile-btn" style="margin-top:24px;height:56px;border-radius:16px;border:2px solid #9333ea;background:#9333ea;color:#fff;font-size:16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 5px 0 0 #6b21a8">Upgrade to Pro</button>

    
    
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
