<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="50" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="bold" fill="#f0f6fc">
    🌐 Multimodal Vector Projection Engine
  </text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#8b949e">
    Projecting Vision, Acoustic Waveforms, and Natural Text into Unified Mathematical Vectors
  </text>

  <!-- Left: Sensory Inputs -->
  <g transform="translate(60, 120)">
    <!-- Image Card -->
    <rect width="240" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#58a6ff"/>
    <text x="20" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">🖼️ Vision Input</text>
    <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#c9d1d9">RGB Pixel Array (H x W x 3)</text>
    <text x="20" y="75" font-family="sans-serif" font-size="11" fill="#8b949e">Photos, Frame Flashes, Screenshots</text>

    <!-- Audio Card -->
    <rect y="120" width="240" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect y="120" width="6" height="90" rx="3" fill="#3fb950"/>
    <text x="20" y="152" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3fb950">🎧 Sound Input</text>
    <text x="20" y="175" font-family="sans-serif" font-size="12" fill="#c9d1d9">1D Waveform @ 44.1kHz</text>
    <text x="20" y="195" font-family="sans-serif" font-size="11" fill="#8b949e">Bird chirps, Alarms, Voice dB</text>

    <!-- Text Card -->
    <rect y="240" width="240" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect y="240" width="6" height="90" rx="3" fill="#bc8cff"/>
    <text x="20" y="272" font-family="sans-serif" font-size="16" font-weight="bold" fill="#bc8cff">📝 Query Text</text>
    <text x="20" y="295" font-family="sans-serif" font-size="12" fill="#c9d1d9">Natural Language Strings</text>
    <text x="20" y="315" font-family="sans-serif" font-size="11" fill="#8b949e">"bird chirping", "sample QR flash"</text>
  </g>

  <!-- Middle: Neural Encoders -->
  <g transform="translate(370, 120)">
    <!-- Vision Transformer -->
    <rect width="260" height="90" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="20" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">CLIP / SigLIP Encoder</text>
    <text x="20" y="60" font-family="sans-serif" font-size="11" fill="#c9d1d9">Vision Transformer (ViT-B/32)</text>
    <text x="20" y="78" font-family="sans-serif" font-size="11" fill="#8b949e">Patch Extraction &amp; Self-Attention</text>

    <!-- Audio Transformer -->
    <rect y="120" width="260" height="90" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
    <text x="20" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3fb950">Acoustic &amp; Mel Engine</text>
    <text x="20" y="180" font-family="sans-serif" font-size="11" fill="#c9d1d9">FFT Power Spectrum &amp; 64 Mel Bands</text>
    <text x="20" y="198" font-family="sans-serif" font-size="11" fill="#8b949e">Loudness (dB) + Spectral Centroid</text>

    <!-- Text Transformer -->
    <rect y="240" width="260" height="90" rx="8" fill="#21262d" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="20" y="275" font-family="sans-serif" font-size="14" font-weight="bold" fill="#bc8cff">Text Projection Head</text>
    <text x="20" y="300" font-family="sans-serif" font-size="11" fill="#c9d1d9">Distilled Transformer / BGE-M3</text>
    <text x="20" y="318" font-family="sans-serif" font-size="11" fill="#8b949e">Bypasses Pre-fill Token Overhead</text>
  </g>

  <!-- Right: Unified Vector Space -->
  <g transform="translate(700, 150)">
    <circle cx="120" cy="130" r="110" fill="#161b22" stroke="#f1e05a" stroke-width="2"/>
    <text x="65" y="115" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f1e05a">Shared Vector</text>
    <text x="80" y="135" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f1e05a">Space (ℝᴰ)</text>
    <text x="60" y="165" font-family="sans-serif" font-size="11" fill="#c9d1d9">Cosine Similarity</text>
    <text x="45" y="185" font-family="sans-serif" font-size="10" fill="#8b949e">Sub-10ms Cross-Modal</text>
    <text x="75" y="200" font-family="sans-serif" font-size="10" fill="#8b949e">Semantic Match</text>
  </g>

  <!-- Connective Lines -->
  <path d="M 300 165 L 370 165" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 300 285 L 370 285" stroke="#3fb950" stroke-width="2"/>
  <path d="M 300 405 L 370 405" stroke="#bc8cff" stroke-width="2"/>

  <path d="M 630 165 L 720 230" stroke="#58a6ff" stroke-width="2"/>
  <path d="M 630 285 L 710 280" stroke="#3fb950" stroke-width="2"/>
  <path d="M 630 405 L 720 330" stroke="#bc8cff" stroke-width="2"/>
</svg>
