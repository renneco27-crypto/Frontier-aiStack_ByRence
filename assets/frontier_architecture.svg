<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#f1e05a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Title Banner -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f0f6fc">
    ⚡ Frontier AI Stack Architecture
  </text>
  <text x="50" y="85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#8b949e">
    Unified Decision Matrix &amp; Multimodal AI Engine By Rence
  </text>

  <!-- LAYER 1: SENSORY & INGESTION -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="900" height="95" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="95" rx="4" fill="url(#blueGrad)"/>
    <text x="25" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">LAYER 1: SENSORY &amp; MULTIMODAL INGESTION</text>
    <g transform="translate(25, 45)">
      <!-- Box 1 -->
      <rect width="200" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="10" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">🖼️ Vision (CLIP / SigLIP)</text>
      <!-- Box 2 -->
      <rect x="215" width="200" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="225" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">🎧 Sound &amp; Waveforms (CLAP)</text>
      <!-- Box 3 -->
      <rect x="430" width="200" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="440" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">📄 DocLayout-YOLO / PyMuPDF</text>
      <!-- Box 4 -->
      <rect x="645" width="210" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="655" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">☁️ Google Drive &amp; Web Scrapers</text>
    </g>
  </g>

  <!-- LAYER 2: COMPRESSION & FAST RETRIEVAL -->
  <g transform="translate(50, 230)" filter="url(#shadow)">
    <rect width="900" height="95" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="95" rx="4" fill="url(#greenGrad)"/>
    <text x="25" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3fb950">LAYER 2: COMPRESSION &amp; DETERMINISTIC RETRIEVAL</text>
    <g transform="translate(25, 45)">
      <rect width="270" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="10" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">⚡ Microsoft LLMLingua-2 (SLM)</text>
      <rect x="285" width="270" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="295" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">🔍 BM25 Sparse Lexical Scoring (&lt;5ms)</text>
      <rect x="570" width="285" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="580" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">🕸️ Graphify BFS Knowledge Traversal</text>
    </g>
  </g>

  <!-- LAYER 3: REASONING & OPTIMIZATION -->
  <g transform="translate(50, 350)" filter="url(#shadow)">
    <rect width="900" height="95" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="95" rx="4" fill="url(#purpleGrad)"/>
    <text x="25" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#bc8cff">LAYER 3: COGNITIVE REASONING &amp; CODE INTELLIGENCE</text>
    <g transform="translate(25, 45)">
      <rect width="200" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="10" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">🧠 Gemini 4 Argon / PySlick</text>
      <rect x="215" width="200" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="225" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">📐 SymPy Exact Math Solver</text>
      <rect x="430" width="200" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="440" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">🎯 DSPy Prompt Compiler</text>
      <rect x="645" width="210" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="655" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">🔎 Levenshtein / Jaccard Verifier</text>
    </g>
  </g>

  <!-- LAYER 4: SPATIAL QA & DEPLOYMENT -->
  <g transform="translate(50, 470)" filter="url(#shadow)">
    <rect width="900" height="95" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="95" rx="4" fill="url(#goldGrad)"/>
    <text x="25" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f1e05a">LAYER 4: SPATIAL QA, REVERSING &amp; DEPLOYMENT</text>
    <g transform="translate(25, 45)">
      <rect width="270" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="10" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">📐 Spatial Inspector (3D WebGL / CDP)</text>
      <rect x="285" width="270" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="295" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">🛠️ REA MCP (Binary &amp; APK Reversing)</text>
      <rect x="570" width="285" height="36" rx="6" fill="#21262d" stroke="#30363d"/>
      <text x="580" y="23" font-family="sans-serif" font-size="12" fill="#c9d1d9">📱 PNPM Android &amp; Next.js Hybrid App</text>
    </g>
  </g>
</svg>
